name: Verify MaestroAI
on:
  push:
    branches: [main, Maestro457, Maestro-6, Maestro4567]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}-${{ (github.ref == 'refs/heads/Maestro-6' || github.ref == 'refs/heads/Maestro4567') && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/Maestro-6' || github.ref == 'refs/heads/Maestro4567' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check local-file safeguards and Gradle notices
        run: |
          python3 verification/check_repository.py --self-test
          python3 verification/check_repository.py
      - name: Build and run standalone regressions
        run: bash gradlew --no-daemon -I verification/verification.init.gradle clean build standaloneRegression phase7Benchmark --stacktrace
      - name: Check JAR and checker regressions
        run: |
          python3 verification/check_jar.py --self-test
          python3 verification/check_jar.py
      - name: Verify exact Cobblemon native dispatch Mixin ABI
        run: |
          python3 verification/runtime_hook_oracle.py
          python3 verification/check_native_split_hooks.py
      - name: Verify pinned simulator source and relocated engine
        run: |
          node --version
          python3 verification/source_oracle.py --self-test
          python3 verification/source_oracle.py
