name: Verify MaestroAI
on:
  push:
    branches: [main]
    paths:
      - 'LICENSE'
      - '.gitignore'
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'verification/**'
      - '.github/workflows/verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'LICENSE'
      - '.gitignore'
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'verification/**'
      - '.github/workflows/verify.yml'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check repository safeguards and notice regressions
        run: |
          python3 verification/check_repository.py --self-test
          python3 verification/check_repository.py
      - name: Build and run standalone regressions
        run: bash gradlew --no-daemon -I verification/verification.init.gradle clean build standaloneRegression --stacktrace
      - name: Check JAR and checker regressions
        run: |
          python3 verification/check_jar.py --self-test
          python3 verification/check_jar.py build/libs/maestroai-1.0.0.jar
      - name: Verify pinned simulator source and relocated engine
        run: |
          node --version
          python3 verification/source_oracle.py --self-test
          python3 verification/source_oracle.py
