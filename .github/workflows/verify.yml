name: Verify MaestroAI
on:
  push:
    branches: [main, Maestro457, Maestro-6, Maestro4567, Maestro-2.0]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # One verification generation per branch/PR: obsolete commits cancel.
  # Exact-commit verification and publication remain mandatory on the final SHA.
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/Maestro-6' || github.ref == 'refs/heads/Maestro4567' || github.ref == 'refs/heads/Maestro-2.0' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check local-file safeguards and Gradle notices
        run: |
          python3 verification/check_repository.py --self-test
          python3 verification/check_repository.py
          python3 verification/check_registration.py --self-test
          python3 verification/check_registration.py
      - name: Build and run standalone regressions
        run: bash gradlew --no-daemon -I verification/verification.init.gradle clean build standaloneRegression phase7Benchmark --stacktrace
      - name: Check JAR and checker regressions
        run: |
          python3 verification/check_jar.py --self-test
          python3 verification/check_jar.py
          python3 verification/phase5_verify_download.py --self-test
          python3 verification/phase5_minecraft_log_gate.py --self-test
      - name: Verify exact Cobblemon native dispatch Mixin ABI
        run: |
          python3 verification/runtime_hook_oracle.py --self-test
          python3 verification/runtime_hook_oracle.py --verify-pinned
      - name: Verify pinned native simulator source and relocated engine
        run: |
          node --version
          python3 verification/source_oracle.py --self-test
          timeout --signal=TERM --kill-after=30s 95m python3 verification/source_oracle.py --native
      # This is deliberately an INTERMEDIATE artifact, not a verified release.
      # An independent pack-source job must also succeed before publication.
      - name: Stage native-verified JAR candidate checksum
        run: |
          VERSION=$(sed -n 's/^version=//p' gradle.properties)
          test -n "$VERSION"
          test -f "build/libs/maestroai-$VERSION.jar"
          mkdir -p build/verified-artifact
          cp "build/libs/maestroai-$VERSION.jar" build/verified-artifact/
          cd build/verified-artifact
          sha256sum "maestroai-$VERSION.jar" > sha256.txt
      - name: Upload intermediate JAR candidate (not release-approved)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # exact SHA
        with:
          name: maestroai-candidate-${{ github.sha }}
          path: build/verified-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Runs independently from the original native differential suite. Both
  # profiles recheck source pins, signatures, dependencies and native hooks.
  pack_source:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check pack-source repository safeguards
        run: |
          python3 verification/check_repository.py --self-test
          python3 verification/check_repository.py
          python3 verification/check_registration.py --self-test
          python3 verification/check_registration.py
      - name: Prepare pinned Cobblemon dependency and Graal verification classes
        run: bash gradlew --no-daemon -I verification/verification.init.gradle remapJar verificationClasses --stacktrace
      - name: Verify pinned pack-source and relocated engine
        run: |
          node --version
          python3 verification/source_oracle.py --self-test
          timeout --signal=TERM --kill-after=30s 48m python3 verification/source_oracle.py --pack

  # The only RELEASE artifact is generated after *both* independent jobs
  # succeed. A missing, cancelled, failed or timed-out job blocks release.
  publish:
    needs: [verify, pack_source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch native-verified candidate from same source commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # exact SHA, v4
        with:
          name: maestroai-candidate-${{ github.sha }}
          path: build/verified-artifact/
      - name: Verify candidate integrity after both simulator profiles pass
        run: |
          python3 verification/check_publish_artifact.py --self-test
          python3 verification/check_publish_artifact.py build/verified-artifact/
      - name: Upload verified Minecraft JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # exact SHA
        with:
          name: maestroai-verified-${{ github.sha }}
          path: build/verified-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
