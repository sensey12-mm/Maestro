allprojects {
    afterEvaluate { p ->
        p.sourceSets.create('verification') {
            java.srcDirs = ['verification/java']
            resources.srcDirs = []
            compileClasspath += p.sourceSets.main.output + p.configurations.compileClasspath
            runtimeClasspath = output + compileClasspath
        }
        p.dependencies.add('verificationImplementation', 'org.ow2.asm:asm-commons:9.6')
        p.tasks.register('standaloneRegression', JavaExec) {
            dependsOn p.tasks.named('verificationClasses'), p.tasks.named('remapJar')
            classpath = p.sourceSets.verification.output +
                    p.files(p.tasks.named('remapJar').flatMap { it.archiveFile }) +
                    p.configurations.compileClasspath + p.configurations.verificationRuntimeClasspath
            mainClass = 'com.maestroai.training.StandaloneRegression'
        }
        // Offline-only operator readiness probe: same signed archive
        // inputs as Minecraft startup, but cannot certify game acceptance.
        p.tasks.register('phase5ArchivePreflight', JavaExec) {
            dependsOn p.tasks.named('verificationClasses'), p.tasks.named('remapJar')
            classpath = p.sourceSets.verification.output +
                    p.files(p.tasks.named('remapJar').flatMap { it.archiveFile }) +
                    p.configurations.compileClasspath + p.configurations.verificationRuntimeClasspath
            mainClass = 'com.maestroai.training.PublicHistoricalRoleOperatorPreflight'
            doFirst {
                def keys = System.getProperties().stringPropertyNames()
                        .findAll { it.startsWith('maestroai.phase5Archive.') }
                keys.each { key -> systemProperty key, System.getProperty(key) }
                systemProperty 'maestroai.phase5HistoricalRolesObserve',
                        System.getProperty('maestroai.phase5HistoricalRolesObserve', 'false')
            }
        }
        p.tasks.register('phase5ArchiveImport', JavaExec) {
            dependsOn p.tasks.named('verificationClasses'), p.tasks.named('remapJar')
            classpath = p.sourceSets.verification.output +
                    p.files(p.tasks.named('remapJar').flatMap { it.archiveFile }) +
                    p.configurations.compileClasspath + p.configurations.verificationRuntimeClasspath
            mainClass = 'com.maestroai.training.PublicHistoricalRoleArchiveProvisioner'
            doFirst {
                if (!p.hasProperty('phase5ImportArgs'))
                    throw new GradleException('Missing phase5ImportArgs: see Phase 5 operator guide')
                args(p.property('phase5ImportArgs').toString().split('\\|', -1))
            }
        }
        // Read-only unified Phase 5 operator commissioning audit. No
        // archive write or game invocation; all inputs stay local.
        p.tasks.register('phase5CommissionAudit', JavaExec) {
            dependsOn p.tasks.named('verificationClasses'), p.tasks.named('remapJar')
            classpath = p.sourceSets.verification.output +
                    p.files(p.tasks.named('remapJar').flatMap { it.archiveFile }) +
                    p.configurations.compileClasspath + p.configurations.verificationRuntimeClasspath
            mainClass = 'com.maestroai.training.PublicPhase5CommissioningAudit'
            doFirst {
                if (!p.hasProperty('phase5AuditArgs'))
                    throw new GradleException('Missing phase5AuditArgs: see Phase 5 operator guide')
                args(p.property('phase5AuditArgs').toString().split('\\|', -1))
            }
        }
        p.tasks.register('phase7Benchmark', JavaExec) {
            dependsOn p.tasks.named('verificationClasses'), p.tasks.named('remapJar')
            classpath = p.sourceSets.verification.output +
                    p.files(p.tasks.named('remapJar').flatMap { it.archiveFile }) +
                    p.configurations.compileClasspath + p.configurations.verificationRuntimeClasspath
            mainClass = 'com.maestroai.training.Phase7Benchmark'
            args(p.hasProperty('phase7Fixture')
                    ? p.property('phase7Fixture').toString()
                    : 'verification/benchmarks/phase7_1_synthetic.json')
        }
        p.tasks.register('sourceVerification', JavaExec) {
            dependsOn p.tasks.named('verificationClasses'), p.tasks.named('remapJar')
            // Baseline CI spent ~31m in this relocated/interpreted Graal suite,
            // ~22m after modifier composition and before move attestation PASS.
            // Cap only this verification child; never alter production JVM flags.
            minHeapSize = '512m'
            maxHeapSize = '3g'
            // Keep compilation/build on Temurin; only the pinned, source-only
            // Graal JS execution child uses its dedicated optimizing JDK.
            def sourceJava = System.getenv('MAESTRO_SOURCE_JAVA')
            if (sourceJava) executable = sourceJava
            classpath = p.sourceSets.verification.output +
                    p.files(p.tasks.named('remapJar').flatMap { it.archiveFile }) +
                    p.configurations.compileClasspath + p.configurations.verificationRuntimeClasspath
            mainClass = 'com.maestroai.training.SourceVerification'
            doFirst {
                if (!p.hasProperty('verificationSource')) throw new GradleException('Missing pinned extracted source directory')
                args p.property('verificationSource')
                if (!p.hasProperty('verificationDependency')) throw new GradleException('Missing pinned dependency for native dispatch integration')
                args p.property('verificationDependency')
                if (p.hasProperty('verificationPack')) args 'pack'
                if (p.hasProperty('verificationLayoutOnly')) args 'layout-only'
            }
        }
    }
}
